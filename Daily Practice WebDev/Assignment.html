<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Flowers School</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            margin: 0;
            background-color: #f4f7fa;
        }

        /* Top Logo Box */
        .logo-box {
            background-color: #4CAF50;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        .logo-box img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-right: 15px;
        }

        .logo-box h1 {
            color: white;
            font-size: 24px;
            margin: 0;
        }

        /* Student Info Box */
        .student-box {
            background-color: #4CAF50;
            color: white;
            margin: 40px auto;
            width: 55%;
            border-radius: 12px;
            padding: 25px;
            display: none;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .student-box img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin-right: 25px;
            border: 3px solid white;
        }

        .student-info h2 {
            margin: 0 0 10px;
        }

        .student-info p {
            margin: 6px 0;
            font-size: 15px;
        }

        /* Welcome Section */
        .content {
            text-align: center;
            margin-top: 40px;
        }

        .content h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .content p {
            color: #555;
        }

        button {
            padding: 10px 25px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #222;
        }
    </style>

    <script>
        function showProfile() {
            document.getElementById('studentBox').style.display = 'flex';
        }
    </script>
</head>
